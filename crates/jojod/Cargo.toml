[package]
name = "jojod"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jojod"
path = "src/lib.rs"

[[bin]]
name = "jojod"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
jojo-grid.workspace = true
jojo-proto.workspace = true
jojo-agent.workspace = true
ulid.workspace = true
portable-pty.workspace = true
serde.workspace = true
# preserve_order keeps the key order of ~/.claude/settings.json when install-hooks rewrites it.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# fork, setsid and flock for `serve --daemonize` (already in the build through portable-pty).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
