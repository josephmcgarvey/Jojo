[package]
name = "jojo-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jojo_app"
path = "src/lib.rs"

[[bin]]
name = "jojo"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
jojo-proto.workspace = true
jojod.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true
tokio.workspace = true
ts-rs.workspace = true
# machines.toml (spec 4); the same version Tauri already uses.
toml = "1"
# Passwords of remote locations, in Windows Credential Manager or the macOS
# Keychain (credentials.rs).
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
# Windows toast notifications (spec 7.4 item 5).
tauri-winrt-notification = "0.8"
windows-sys = { workspace = true, features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
] }

[target.'cfg(unix)'.dependencies]
# getpwuid (the user's login shell) and getuid.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS notifications (spec 7.4 item 5).
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile.workspace = true
