# Tests Jojo on macOS and builds the macOS installers (.dmg), one for Apple
# Silicon and one for Intel Macs. The builds are unsigned (ad-hoc signed with
# signingIdentity "-"): on first launch macOS asks to confirm the app in
# System Settings > Privacy & Security > Open Anyway, or run
# `xattr -dr com.apple.quarantine /Applications/Jojo.app`.
#
# The .dmg files are attached to each run as artifacts (Actions > the run >
# Artifacts).
name: macOS

# Run by hand only (Actions > macOS > Run workflow, or
# `gh workflow run macos.yml`): macOS builds are made when asked for, not on
# every push.
on:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job tests and then builds both installers on the same machine. With
  # separate jobs, the test job always found a macOS machine and the build
  # job that waited for it often did not ("The job was not acquired by
  # Runner of type hosted even after multiple attempts"), so three runs in a
  # row produced no Apple Silicon installer.
  build:
    name: Test and build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Frontend checks and tests
        run: pnpm check && pnpm test && pnpm lint:colors
        working-directory: app
      # The app crate's tests need the frontend's dist folder to exist
      # (tauri::generate_context! embeds it).
      - name: Build frontend
        run: pnpm build
        working-directory: app
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --no-fail-fast
      # The Linux daemons that Add remote location installs on servers are
      # built with cargo-zigbuild (scripts/stage-daemon.sh).
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build the Apple Silicon app and .dmg
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: Jojo-macos-apple-silicon
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Build the Intel app and .dmg
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: Jojo-macos-intel
          path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
